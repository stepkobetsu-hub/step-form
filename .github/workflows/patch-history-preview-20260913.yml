name: Patch LINE teacher history preview

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_history_preview_20260913.py'
      - '.github/workflows/patch-history-preview-20260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compact history preview
        run: python3 scripts/patch_history_preview_20260913.py
      - name: Verify
        run: |
          grep -q 'history-summary-preview' teacher_line_contact_v3.js
          grep -q 'history-summary-arrow' teacher_line_contact.html
          grep -q 'history-preview-v1' teacher_line_contact.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teacher_line_contact_v3.js teacher_line_contact.html
          git commit -m 'Show compact expandable LINE send history'
          git push
